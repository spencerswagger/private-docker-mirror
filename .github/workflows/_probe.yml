name: Probe SWR endpoints (temp)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        env:
          SWR_AK: ${{ secrets.SWR_AK }}
          SWR_SK: ${{ secrets.SWR_SK }}
          SWR_REGION: cn-east-5
          SWR_NAMESPACE: spencerswagger
        run: |
          chmod +x ./probe-endpoints.sh
          ./probe-endpoints.sh

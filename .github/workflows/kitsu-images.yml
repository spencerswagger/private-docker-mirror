name: kitsu-images

# 构建 Kitsu 自托管所需的自研镜像并推到华为云 SWR：
#   spencerswagger/kitsu-zou   （Zou API + event stream，两者共用同一镜像）
#   spencerswagger/kitsu-web   （Kitsu 前端 + nginx 反代）
# 基础镜像（postgres/redis/meilisearch）走仓库已有的 Docker Hub 同步流程，不在本 workflow 里。

on:
  workflow_dispatch:
  push:
    paths:
      - 'kitsu/**'
      - '.github/workflows/kitsu-images.yml'

permissions:
  contents: read

env:
  REGISTRY: swr.cn-east-5.myhuaweicloud.com
  NAMESPACE: spencerswagger
  PLATFORMS: linux/amd64

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: kitsu-zou
            dockerfile: ./kitsu/zou.Dockerfile
            context: ./kitsu
          - name: kitsu-web
            dockerfile: ./kitsu/web.Dockerfile
            context: ./kitsu
    steps:
      - uses: actions/checkout@v4

      - name: Compute tags
        id: meta
        run: |
          set -eu
          short="$(git rev-parse --short=7 HEAD)"
          echo "tags=${REGISTRY}/${NAMESPACE}/${{ matrix.name }}:${short},${REGISTRY}/${NAMESPACE}/${{ matrix.name }}:latest" >> "$GITHUB_OUTPUT"

      - name: Check registry credentials
        id: creds
        env:
          SWR_USERNAME: ${{ secrets.SWR_USERNAME || secrets.DOCKER_USERNAME }}
          SWR_PASSWORD: ${{ secrets.SWR_PASSWORD || secrets.DOCKER_PASSWORD }}
        run: |
          if [ -n "${SWR_USERNAME}" ] && [ -n "${SWR_PASSWORD}" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "::warning::缺少 SWR_USERNAME/SWR_PASSWORD，降级为只构建不推送"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Login to SWR
        if: steps.creds.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.SWR_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD || secrets.DOCKER_PASSWORD }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.PLATFORMS }}
          push: ${{ steps.creds.outputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          sbom: false

      - name: Digest
        if: always()
        run: |
          echo "### ${{ matrix.name }}" >> $GITHUB_STEP_SUMMARY
          echo "- tags: \`${{ steps.meta.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- push: ${{ steps.creds.outputs.push }}" >> $GITHUB_STEP_SUMMARY
          echo "- digest: \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
